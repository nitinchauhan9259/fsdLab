                <div>
                    <label for="select-city">Select your city</label>
                    <select name="city" id="select-city">

                      <option value="Mumbai">Mumbai</option>
                      <option value="Deklhi">Delhi</option>
                      <option value="Kolkata">Kolkata</option>

                    <input type="date" name="dd" id="dd" >
                </div>
            </form>
        </div>
            
          <div class="container4">
               <h2>Bus Information</h2>
          </div>

          <div clas="contain1">
            <form action="">
                <div>
                     <input type="radio" id="ac-bus" name="ac-bus">
                <label>AC BUS 2000</label>
                </div>
              
                <div>
                     <input type="radio" id="ac-bus" name="ac-bus">
