<body>
    <script>
        const num=[11,22,44,5,8,81];
        const even=num.filter((i)=>{
            return i%2==0;
        })
        const sq=even.map((i)=>{
         return i*2;
        })
        console.log("Num",num);
        console.log("Even",even);
        console.log("Square",sq);
    </script>
</body>
